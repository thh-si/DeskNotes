name: Release
# Every push to main builds the disk image as a check. Pushing a tag like v1.0.2 also attaches it to a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Use the newest Xcode on the runner: the code is written for a recent Swift.
      - run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          swift --version
      - run: swift run CoreChecks
      - name: Build the disk image
        run: |
          ./make-dmg.sh > dmg.log 2>&1 || {
            # Public annotation, since the raw log needs a login to read.
            echo "::error title=make-dmg failed::$(tail -n 30 dmg.log | cut -c1-300 | tr '\n' '|' | sed 's/%/%25/g')"
            exit 1
          }
          tail -n 5 dmg.log
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build.noindex/*.dmg
          generate_release_notes: true
